<!DOCTYPE html>
<html lang="pt-BR" data-t="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D111E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Finanças</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%232A5BE0'/%3E%3Cpath d='M16 42V22M32 42V14M48 42V28' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M12 51h40' stroke='%23BFD0FF' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800;900&family=Red+Hat+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('financas_tema');document.documentElement.dataset.t=t==='claro'?'claro':'escuro';}catch(e){}</script>
<style>
:root{
  --bg:#F3F5FB; --surf:#FFFFFF; --surf2:#E8ECF6; --line:rgba(17,24,48,.10); --line2:rgba(17,24,48,.22);
  --tx:#111729; --tx2:#434C66; --tx3:#75809A;
  --ac:#2A5BE0; --ac-ink:#FFFFFF; --ac-soft:rgba(42,91,224,.10);
  --ok:#0E8A5F; --ok-soft:rgba(14,138,95,.11);
  --info:#6B4BD8; --info-soft:rgba(107,75,216,.11);
  --war:#9C5F06; --war-soft:rgba(156,95,6,.12);
  --bad:#B4382F; --bad-soft:rgba(180,56,47,.11);
  --r:18px; --r-s:12px; --lado:16px; --max:720px;
  --fd:'Red Hat Display','Red Hat Text',system-ui,sans-serif;
  --ft:'Red Hat Text',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
[data-t="escuro"]{
  --bg:#0D111E; --surf:#151A2B; --surf2:#1E2539; --line:rgba(205,218,255,.09); --line2:rgba(205,218,255,.20);
  --tx:#EBEEF8; --tx2:#B5BCD1; --tx3:#7F88A2;
  --ac:#6C9BFF; --ac-ink:#08112B; --ac-soft:rgba(108,155,255,.14);
  --ok:#4FCB9B; --ok-soft:rgba(79,203,155,.13);
  --info:#B7A2FF; --info-soft:rgba(183,162,255,.14);
  --war:#EBB45F; --war-soft:rgba(235,180,95,.13);
  --bad:#F38A80; --bad-soft:rgba(243,138,128,.13);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:var(--ft);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;min-height:100dvh;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{background:none;border:none;cursor:pointer;font-weight:600;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
svg{flex:none;display:block}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 var(--lado)}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.war{color:var(--war)}.info{color:var(--info)}.dim{color:var(--tx3)}
body.hide .n,body.hide input.money{filter:blur(7px)}

/* topo */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand b{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:-.02em}
.mark{width:22px;height:22px;border-radius:7px;background:var(--ac);display:grid;place-items:center;color:var(--ac-ink)}
.sync{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--tx3);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.sync.s-saved{color:var(--ok)}.sync.s-offline{color:var(--war)}
.tools{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);flex:none}
.ib:hover,.ib:active{background:var(--surf2)}
.ib.on{color:var(--ac);background:var(--ac-soft)}
.ib.sm{width:32px;height:32px;border-radius:10px}

main{padding:14px 0 28px}
h1{font-family:var(--fd);font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
h2{font-family:var(--fd);font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
h3{font-family:var(--fd);font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.lead{color:var(--tx3);font-size:13.5px;margin-top:3px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:36px}
.sec-h h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.hint{font-size:13px;color:var(--tx3);line-height:1.45}
.hint b{color:var(--tx2)}
.empty{padding:22px 16px;text-align:center;color:var(--tx3);font-size:13.5px;line-height:1.5}
.empty b{display:block;color:var(--tx2);font-size:14.5px;margin-bottom:3px}
.note{background:var(--info-soft);border-radius:var(--r-s);padding:11px 13px;font-size:13px;color:var(--tx2);line-height:1.5}
.note b{color:var(--tx)}
.note.w{background:var(--war-soft)}
.note.act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note.act span{flex:1;min-width:180px}

/* seletor de mês */
.mbar{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:5px}
.mbar-l{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;border-radius:12px;
  font-family:var(--fd);font-size:16px;font-weight:600;color:var(--tx2);letter-spacing:-.01em}
.mbar-l b{font-weight:800;color:var(--tx)}
.mbar-l:hover{background:var(--surf2)}

/* superfícies e linhas */
.sf{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.sf+.sf{margin-top:10px}
.sf-p{padding:15px}
.grid2{display:grid;gap:10px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid2>.sf+.sf{margin-top:0}}
.row{display:flex;align-items:center;gap:4px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);min-height:54px}
.row:last-child{border-bottom:none}
.row-m{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 6px 10px 8px;min-height:54px;color:var(--tx3);border-radius:10px}
.row-m:hover .row-n{color:var(--ac)}
.row-n{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--tx);overflow-wrap:anywhere;line-height:1.3}
.row-n small{display:block;font-size:12.5px;font-weight:500;color:var(--tx3);margin-top:1px}
.row-v{font-size:15px;font-weight:700;color:var(--tx)}
.row.paid .row-n{color:var(--tx3);text-decoration:line-through;text-decoration-thickness:1px}
.row.paid .row-n small{text-decoration:none}
.row.paid .row-v{color:var(--tx3)}
.row.flat{padding:0 6px}
.ck{width:44px;height:44px;display:grid;place-items:center;flex:none;color:transparent;border-radius:12px}
.ck::before{content:'';position:absolute;width:24px;height:24px;border-radius:8px;border:1.6px solid var(--line2);transition:.12s}
.ck{position:relative}
.ck svg{position:relative}
.ck.on{color:var(--ac-ink)}
.ck.on::before{background:var(--ac);border-color:var(--ac)}
.add{display:flex;gap:8px;padding:12px;border-top:1px dashed var(--line2);flex-wrap:wrap;background:color-mix(in srgb,var(--surf2) 45%,transparent)}
.add .in{flex:1 1 130px}
.add .in.num{flex:0 1 104px}
@media (max-width:400px){.add .btn{flex:1 1 100%}}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 15px;border-radius:var(--r-s);
  border:1px solid var(--line2);background:var(--surf);color:var(--tx);font-weight:700;font-size:14.5px;white-space:nowrap;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.btn.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.dng.fill{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px;font-weight:600}
.btn.full{width:100%}
.btn.txt{border-color:transparent;background:none;color:var(--ac);padding:0 8px}
.lnk{display:flex;align-items:center;gap:11px;width:100%;min-height:50px;padding:0 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;color:var(--tx)}
.lnk:last-child{border-bottom:none}
.lnk svg{color:var(--tx3)}
.lnk.dng{color:var(--bad)}.lnk.dng svg{color:var(--bad)}

/* campos */
.fd{display:flex;flex-direction:column;min-width:0}
.fd>span{font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.in{width:100%;background:var(--surf2);border:1px solid transparent;border-radius:var(--r-s);padding:11px 12px;font-size:16px;font-weight:500;line-height:1.35;color:var(--tx);min-height:46px}
.in:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.in::placeholder{color:var(--tx3)}
.in.num{font-variant-numeric:tabular-nums}
textarea.in{resize:vertical;min-height:70px}
select.in{appearance:none;-webkit-appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select option,select optgroup{background:var(--surf);color:var(--tx)}
.fg{display:grid;gap:12px}
.fg.c2{grid-template-columns:1fr 1fr}
.fg.c3{grid-template-columns:1fr 1fr}
@media (min-width:480px){.fg.c3{grid-template-columns:repeat(3,1fr)}}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px;font-weight:600;min-height:36px}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--ac)}
.seg{display:flex;gap:3px;padding:3px;background:var(--surf2);border-radius:13px}
.seg button{flex:1;min-height:38px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--tx3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.fit{flex:none}.seg.fit button{flex:none;overflow:visible;min-height:32px}

/* selos e barras */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--ft);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surf2);color:var(--tx2);white-space:nowrap;letter-spacing:0;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.war{background:var(--war-soft);color:var(--war)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.bar{height:8px;border-radius:99px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .4s ease}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surf2);color:var(--tx3)}
.tags span.ok{background:var(--ok-soft);color:var(--ok)}.tags span.war{background:var(--war-soft);color:var(--war)}

/* início */
.hero{padding:22px 2px 4px}
.hero-l{font-size:14.5px;font-weight:600;color:var(--tx2)}
.hero-v{font-family:var(--fd);font-weight:900;letter-spacing:-.045em;line-height:1;margin-top:6px;display:flex;align-items:baseline;gap:3px;color:var(--tx)}
.hero-v.bad{color:var(--bad)}
.hero-v small{font-size:19px;font-weight:700;letter-spacing:0;opacity:.75}
.hero-v b{font-size:clamp(44px,13vw,64px);font-weight:900}
.hero-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:var(--tx3);font-weight:500}
.rg{margin-top:20px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 12px}
.rg-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rg-c{min-width:0}
.rg-t{font-size:13px;font-weight:600;color:var(--tx3)}
.rg-r{display:block;font-family:var(--fd);font-size:18px;font-weight:800;letter-spacing:-.03em;margin:1px 0 9px}
.rg-bar{display:flex;height:14px;border-radius:5px;background:var(--surf2);overflow:hidden}
.rg-bar i{display:block;height:100%;transition:width .4s ease}
.rg-bar .pg{background:var(--ac)}
.rg-bar .pd{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--war) 75%,transparent) 0 4px,color-mix(in srgb,var(--war) 40%,transparent) 4px 8px)}
.rg-bar.over .pg,.rg-bar.over .pd{background:var(--bad)}
.rg-bar.over .pd{opacity:.6}
.rg-f{font-size:12.5px;font-weight:600;margin-top:7px;color:var(--tx3);line-height:1.4}
.rg-rule{position:relative;height:26px;margin-top:12px;border-top:1px solid var(--line2)}
.rg-rule span{position:absolute;top:0;font-size:11.5px;font-weight:600;color:var(--tx3);padding-top:6px;transform:translateX(-50%)}
.rg-rule span::before{content:'';position:absolute;top:0;left:50%;width:1px;height:5px;background:var(--line2)}
.rg-rule span:first-child{transform:none}.rg-rule span:first-child::before{left:0}
.rg-rule span.end{transform:translateX(-100%)}.rg-rule span.end::before{left:100%}
.rg-rule .hoje{color:var(--tx);font-weight:700;white-space:nowrap;z-index:1;background:var(--surf);padding-left:5px;padding-right:5px}
.rg-rule .hoje::before{width:9px;height:9px;border-radius:50%;background:var(--tx);top:-5px;margin-left:-4.5px}
.rg-leg{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--tx3);font-weight:500;margin-top:4px}
.rg-leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.av{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45;color:var(--tx2)}
.av:last-child{border-bottom:none}
.av b{color:var(--tx)}
.av svg{margin-top:2px}
.kv{display:grid;grid-template-columns:1fr 1fr}
.kv div{padding:13px 15px;border-bottom:1px solid var(--line);min-width:0}
.kv div:nth-child(odd){border-right:1px solid var(--line)}
.kv div:nth-last-child(-n+2){border-bottom:none}
.kv span{display:block;font-size:13px;color:var(--tx3);font-weight:500}
.kv b{display:block;font-family:var(--fd);font-size:18px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.kv.c4 div small{display:block;font-size:12px;color:var(--tx3);margin-top:1px}
@media (min-width:640px){.kv.c4{grid-template-columns:repeat(4,1fr)}.kv.c4 div{border-bottom:none;border-right:1px solid var(--line)}.kv.c4 div:last-child{border-right:none}}

/* gráfico */
.ch-wrap{overflow-x:auto;padding:14px 10px 4px}
.ch{display:flex;gap:6px;min-width:min-content}
.ch-col{flex:1 0 42px;max-width:64px;display:flex;flex-direction:column;align-items:stretch;border-radius:10px;padding:4px 3px 6px}
.ch-col.on{background:var(--surf2)}
.ch-pos{display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.ch-neg{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;border-top:1px dashed var(--line2)}
.ch-col i{display:block;width:100%;max-width:30px;border-radius:5px;background:var(--ac);opacity:.5;min-height:3px}
.ch-col i.w{background:var(--war)}.ch-col i.b{background:var(--bad)}
.ch-col.on i{opacity:1}
.ch-col em{font-style:normal;font-size:11px;font-weight:700;color:var(--tx3);padding:2px 0}
.ch-col.on em{color:var(--tx)}
.ch-col u{text-decoration:none;font-size:11.5px;font-weight:600;color:var(--tx3);text-align:center;margin-top:5px;white-space:nowrap}
.ch-col.on u{color:var(--tx);font-weight:700}
.ch-st{padding:12px 15px 14px;border-top:1px solid var(--line);display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--tx3)}
.ch-st strong{font-family:var(--fd);font-size:15px;color:var(--tx);margin-right:auto}
.ch-st b{color:var(--tx)}

/* blocos (cartão, meta, dívida) */
.tl-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tl-h b{font-family:var(--fd);font-size:16px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.tl-v{font-family:var(--fd);font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.tl-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.two span{display:block;font-size:13px;color:var(--tx3);font-weight:500}
.two b{font-family:var(--fd);font-size:19px;font-weight:800;letter-spacing:-.03em}
.sim-r{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surf2);border-radius:var(--r-s);font-size:13px}
.sim-r+.sim-r{margin-top:6px}
.alloc{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.box{background:var(--surf2);border-radius:var(--r-s);padding:12px 13px;font-size:13.5px;display:flex;flex-direction:column;gap:7px}
.box div{display:flex;justify-content:space-between;gap:10px}
.box span{color:var(--tx3)}

/* sessões */
.dots{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dot{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13.5px;font-weight:700;color:var(--tx3)}
.dot.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.dot.pay{border-style:dashed;border-color:var(--war)}
.dot.on.pay{background:var(--war);border-style:solid;color:#fff}
.msg{background:var(--surf2);border-radius:var(--r-s);padding:12px 13px;font-size:13.5px;color:var(--tx2);white-space:pre-line;line-height:1.55}
.log-r{display:flex;align-items:center;gap:10px;padding:2px 0 2px 2px;border-top:1px solid var(--line);font-size:14px}
.log-r b{font-variant-numeric:tabular-nums;min-width:76px}
.log-r span{color:var(--tx3);font-size:13px;flex:1}
details>summary{cursor:pointer;list-style:none;font-size:13.5px;font-weight:600;color:var(--tx3);padding:12px 15px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:' +'}details[open]>summary::after{content:' −'}
.est{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 6px 10px 13px;border-bottom:1px solid var(--line)}
.est:last-child{border-bottom:none}
.est-d{width:50px;text-align:center;border-radius:12px;padding:6px 0 5px;background:var(--surf2)}
.est-d b{display:block;font-family:var(--fd);font-size:19px;font-weight:800;line-height:1.05}
.est-d span{font-size:11.5px;color:var(--tx3);font-weight:600}
.est-t{font-size:15px;font-weight:600;overflow-wrap:anywhere;line-height:1.3;display:block;color:var(--tx)}

function nParc(p){

  if(!applied){applied={};meses.forEach(m=>{applied[pk(m,ciclo,cartao)]=parcela;});}
  return {id:String(p.id??genId()),desc:String(p.desc??''),total:r2(p.total),parcela,
    n:Math.max(1,parseInt(p.n,10)||1),cartao,ciclo,meses,ini:validKey(p.ini)?p.ini:(meses[0]||''),applied};
}
function nCards(raw){
  const o=raw&&typeof raw==='object'?raw:{};
  const limits={};
  Object.keys(o.limits&&typeof o.limits==='object'?o.limits:{}).forEach(k=>{const v=o.limits[k];const n=typeof v==='object'&&v?num(v.limite):num(v);if(n>0)limits[k]=r2(n);});
  const parceladas=(Array.isArray(o.parceladas)?o.parceladas:[]).filter(p=>p&&p.cartao).map(nParc);
  const list=[];
  const add=c=>{c=String(c??'').trim();if(c&&!list.some(x=>same(x,c)))list.push(c);};
  (Array.isArray(o.list)?o.list:[]).forEach(add);parceladas.forEach(p=>add(p.cartao));Object.keys(limits).forEach(add);
  const avulsos=o.avulsos&&typeof o.avulsos==='object'&&!Array.isArray(o.avulsos)?o.avulsos:{};
  return {list,limits,avulsos,parceladas};
}
function mergeCards(nuvem,local){

  return nCards({list:[...nuvem.list,...local.list],limits:{...local.limits,...nuvem.limits},avulsos:{...local.avulsos,...nuvem.avulsos},
    parceladas:[...nuvem.parceladas,...local.parceladas.filter(p=>!ids.has(p.id))]});
}

};
let FS=null,connecting=false,dirty={},syncState='';
const timers={},seq={},seen={},noCloud={};
function markDirty(k,on){if(on)dirty[k]=1;else delete dirty[k];try{localStorage.setItem(K.dirty,JSON.stringify(dirty));}catch{}}
function setSync(s){
  if(s==='saving'&&(!FS||navigator.onLine===false))s='offline';
  syncState=s;
  const map={saving:'Salvando…',saved:'Salvo',offline:'Sem conexão'};
  const el=$('sync');if(el){el.className='sync s-'+s;el.innerHTML=`<i></i>${map[s]||''}`;
    el.title=s==='offline'?'As alterações ficam guardadas neste aparelho e sobem quando a conexão voltar.':'';}
  const m=$('sync-m');if(m)m.textContent=syncText();
}
const syncText=()=>syncState==='saved'?'Tudo salvo na nuvem':syncState==='saving'?'Enviando alterações…'
  :Object.keys(dirty).length?'Sem conexão. Há alterações guardadas só neste aparelho.':'Sem conexão. Usando os dados deste aparelho.';
const syncIdle=()=>setSync(Object.keys(dirty).length?'saving':'saved');
function save(k){
  if(k==='data')invalidate();
  ST[k].ls();
  if(noCloud[k])return;
  markDirty(k,true);setSync('saving');
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>push(k),800);
}
async function push(k){
  clearTimeout(timers[k]);timers[k]=null;
  if(noCloud[k]){markDirty(k,false);return;}
  if(!FS){setSync('offline');connect();return;}
  const v=seq[k]=(seq[k]||0)+1;
  try{
    await FS.setDoc(FS.ref[k],{payload:cloneOf(ST[k].get()),t:Date.now()});
    if(seq[k]===v&&!timers[k])markDirty(k,false);
    syncIdle();
  }catch(e){
    console.error(e);
    if(e&&e.code==='permission-denied'){noCloud[k]=1;markDirty(k,false);syncIdle();}
    else setSync('offline');
  }
}
function flush(){Object.keys(timers).forEach(k=>{if(timers[k])push(k);});}
function onSnap(k,s){
  if(s.metadata&&s.metadata.hasPendingWrites)return;
  const first=!seen[k];seen[k]=1;
  if(k==='cards'&&!lsGet(K.cardsMig,false)){
    /* primeira vez com cartões na nuvem: junta o que está neste aparelho com o que já subiu */
    const nuvem=s.exists()?nCards(s.data().payload):null;
    cards=nuvem?mergeCards(nuvem,cards):cards;
    lsCards();lsSet(K.cardsMig,true);
    if(nuvem?JSON.stringify(cards)!==JSON.stringify(nuvem):hasCards(cards)){markDirty(k,true);push(k);}
    render();return;
  }
  if(!s.exists()){if(first&&ST[k].has()){markDirty(k,true);push(k);}return;}
  if(dirty[k]){if(first&&!timers[k])push(k);return;}
  const inc=ST[k].norm(s.data().payload);
  if(JSON.stringify(inc)===JSON.stringify(ST[k].get()))return;
  ST[k].set(inc);ST[k].ls();
  if(k==='data'){if(!data[cur])cur=pickCur();ensure(cur);}
  render();
  if(!first)toast('Atualizado a partir de outro aparelho.');
}
async function connect(){
  if(FS||connecting||navigator.onLine===false)return;
  connecting=true;
  try{
    const [a,f]=await Promise.all([import(FB_URL+'firebase-app.js'),import(FB_URL+'firebase-firestore.js')]);
    const db=f.getFirestore(a.getApps().length?a.getApp():a.initializeApp(FB_CFG));
    const ref={};Object.keys(DOCN).forEach(k=>{ref[k]=f.doc(db,'financas',DOCN[k]);});
    FS={setDoc:f.setDoc,ref};
    Object.keys(DOCN).forEach(k=>f.onSnapshot(ref[k],s=>onSnap(k,s),e=>{
      console.warn(k,e);
      if(e&&e.code==='permission-denied'){noCloud[k]=1;markDirty(k,false);syncIdle();if(tab==='ajustes')render();}
      else setSync('offline');
    }));
    syncIdle();
  }catch(e){console.warn('Sem nuvem — usando os dados do aparelho.',e);setSync('offline');}
  finally{connecting=false;}
}
window.addEventListener('online',()=>{if(FS){syncIdle();Object.keys(dirty).forEach(k=>{if(!timers[k])push(k);});}else connect();});

let carryCache=null;
const invalidate=()=>{carryCache=null;};
function saldoOf(k){const m=data[k];if(!m)return 0;
  return r2(num(m.rec01)+num(m.rec15)+sum(m.extras)-sum(m.d1)-sum(m.d2)-sum(m.alloc||[]));}
function carry(){if(carryCache)return carryCache;const map={};let a=0;
  keys().forEach(k=>{map[k]=a;a+=saldoOf(k);});carryCache=map;return map;}
function totals(k){
  const m=data[k];if(!m)return null;
  const extras=sum(m.extras),receita=r2(num(m.rec01)+num(m.rec15));
  const all=[...m.d1,...m.d2];
  const despesas=sum(all),pago=sum(all.filter(i=>i.paid));
  const receitaTotal=r2(receita+extras),destinado=sum(m.alloc||[]);
  return {receita,extras,receitaTotal,despesas,pago,destinado,
    pendente:r2(despesas-pago),
    livre:r2(receitaTotal-despesas-destinado),
    pct:receitaTotal>0?Math.round((despesas+destinado)/receitaTotal*100):(despesas>0?999:0),
    carry:r2(carry()[k]||0)};
}
const zoneOf=p=>p<=70?{t:'Com folga',k:'ok'}:p<=85?{t:'Atenção',k:'war'}:p<=100?{t:'No limite',k:'war'}:{t:'Estourou',k:'bad'};

const stack=[];
function sheet(html,o={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sh" role="dialog" aria-modal="true"><div class="sh-grab"></div>${html}</div>`;
  $('sheets').appendChild(ov);stack.push({ov,o});
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('on')));
  ov.addEventListener('pointerdown',e=>{if(e.target===ov)closeSheet();});
  const f=ov.querySelector('[data-focus]');
  if(f)setTimeout(()=>{f.focus();if(f.select&&o.select)f.select();},80);
  return ov;
}
function closeSheet(res){
  const s=stack.pop();if(!s)return;
  s.ov.classList.remove('on');setTimeout(()=>s.ov.remove(),220);
  if(!stack.length)document.body.style.overflow='';
  if(s.o.onClose)s.o.onClose(res);
}
function closeAll(){while(stack.length)closeSheet();}

A.addMonthOk=()=>{

A.delMonth=async d=>{
  const k=d.k;

/* ══ INÍCIO ══ */
function regua(m){
  const [mn,y]=cur.split(' ');
  const dim=new Date(+y,MONTHS.indexOf(mn)+1,0).getDate();
  const cols=['d1','d2'].map(c=>{
    const rec=num(m[REC[c]]),g=sum(m[c]),pg=sum(m[c].filter(i=>i.paid)),pd=r2(g-pg);
    const base=Math.max(rec,g,1),sobra=r2(rec-g),over=g>rec;
    return `<div class="rg-c"><span class="rg-t">${CYCLES[c]} · recebe</span><b class="rg-r n">${fmt(rec)}</b>
      <div class="rg-bar ${over?'over':''}" role="img" aria-label="${CYCLES[c]}: pago ${fmt(pg)}, a pagar ${fmt(pd)}">
        <i class="pg" style="width:${pg/base*100}%"></i><i class="pd" style="width:${pd/base*100}%"></i></div>
      <p class="rg-f">${!rec&&!g?'Nada lançado':sobra>=0?`Sobra <span class="n ok">${fmt(sobra)}</span>`:`Falta <span class="n bad">${fmt(-sobra)}</span>`}</p></div>`;
  }).join('');
  let hoje='';
  if(cur===nowKey()){
    const d=new Date().getDate();
    const pos=d<15?(d-1)/14*50:50+(d-15)/Math.max(dim-15,1)*50;
    hoje=`<span class="hoje" style="left:${Math.min(Math.max(pos,7),93)}%">hoje, ${d}</span>`;
  }
  return `<div class="rg"><div class="rg-cols">${cols}</div>
    <div class="rg-rule" aria-hidden="true"><span style="left:0">dia 1</span><span style="left:50%">15</span><span class="end" style="left:100%">${dim}</span>${hoje}</div>
    <div class="rg-leg"><span><i style="background:var(--ac)"></i>pago</span><span><i style="background:var(--war);opacity:.7"></i>a pagar</span><span><i style="background:var(--surf2)"></i>sobra do ciclo</span></div>
  </div>`;
}
function avisos(t){
  const out=[];
  const add=(k,ico,txt)=>out.push(`<div class="av"><span class="${k}">${svg(ico,18)}</span><span>${txt}</span></div>`);
  if(t.livre<0)add('bad',IC.alert,`As despesas passam a receita em <b class="n">${fmt(-t.livre)}</b> neste mês.`);
  else if(t.pct>85&&t.pct<999)add('war',IC.alert,`<b>${t.pct}%</b> da renda já está comprometida. Acima de 85% o mês fica apertado.`);
  cards.list.forEach(c=>{
    const L=num(cards.limits[c]);if(!L)return;
    const uso=cardUsage(c);
    if(uso>L)add('bad',IC.card,`${esc(c)} passou do limite em <b class="n">${fmt(r2(uso-L))}</b>.`);
    else if(uso/L>=.8)add('war',IC.card,`${esc(c)} está com <b>${Math.round(uso/L*100)}%</b> do limite usado.`);
  });
  const pend=parcPendentes();
  if(pend)add('info',IC.card,`${pl(pend,'parcela de compra ainda não foi lançada','parcelas de compras ainda não foram lançadas')} nos meses. <button class="btn txt sm" data-a="go" data-t="cartoes" style="min-height:0;padding:0">Ver em Cartões</button>`);
  const prox=(sessions.estetica||[]).filter(e=>!e.done&&e.date>=todayISO()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  if(prox){const dd=Math.round((new Date(prox.date+'T12:00')-new Date(todayISO()+'T12:00'))/864e5);
    if(dd<=7)add('info',IC.clock,`${esc(tabNames().est)} ${dd===0?'hoje':dd===1?'amanhã':'em '+dd+' dias'} (${estWhen(prox)}): ${esc(prox.desc)}.`);}
  sessionItems.filter(sesDue).forEach(it=>add('war',IC.clock,`<b>${esc(it.name)}</b>: ${it.spp} sessões feitas, hora de pagar. <button class="btn txt sm" data-a="go" data-t="sessoes" style="min-height:0;padding:0">Abrir</button>`));
  return out;
}
function chartHTML(){
  const anos=[...new Set(keys().map(k=>k.split(' ')[1]))];
  if(chartFilter!=='all'&&!anos.includes(chartFilter))chartFilter='all';
  const ks=keys().filter(k=>chartFilter==='all'||k.endsWith(' '+chartFilter));
  const pts=ks.map(k=>({k,...totals(k)}));
  if(!pts.length)return '';
  const selKey=pts.some(p=>p.k===chartSel)?chartSel:(pts.some(p=>p.k===cur)?cur:pts[pts.length-1].k);
  const max=Math.max(...pts.map(p=>p.livre),0),min=Math.min(...pts.map(p=>p.livre),0),range=(max-min)||1;
  const H=120,hp=min<0?Math.round(H*max/range):H,hn=H-hp;
  const cols=pts.map(p=>{
    const z=zoneOf(p.pct),cl=p.livre<0?'b':z.k==='war'?'w':z.k==='bad'?'b':'';
    const lab=`<em class="n">${p.livre<0?'−':''}${fmtK(p.livre)}</em>`;
    return `<button class="ch-col ${p.k===selKey?'on':''}" data-a="chartSel" data-k="${p.k}" aria-label="${longK(p.k)}: livre ${fmt(p.livre)}">
      <span class="ch-pos" style="height:${hp+18}px">${p.livre>=0?lab+`<i class="${cl}" style="height:${Math.max(p.livre/range*H,3)}px"></i>`:''}</span>
      ${hn?`<span class="ch-neg" style="height:${hn+18}px">${p.livre<0?`<i class="b" style="height:${Math.max(-p.livre/range*H,3)}px"></i>`+lab:''}</span>`:''}
      <u>${short(p.k)}</u></button>`;}).join('');
  const s=pts.find(p=>p.k===selKey),z=zoneOf(s.pct);
  return `<div class="sec"><div class="sec-h"><h2>Sobra mês a mês</h2>
    ${anos.length>1?`<div class="seg fit">${['all',...anos].map(f=>`<button class="${f===chartFilter?'on':''}" data-a="chartFilter" data-f="${f}" style="min-height:32px">${f==='all'?'Tudo':f}</button>`).join('')}</div>`:''}</div>
    <div class="sf"><div class="ch-wrap" id="ch-wrap"><div class="ch">${cols}</div></div>
    <div class="ch-st"><strong>${longK(s.k)}</strong><span class="chip ${z.k}">${z.t}${s.pct===999?'':' · '+s.pct+'%'}</span>
      <span>Receita <b class="n">${fmt(s.receitaTotal)}</b></span><span>Despesas <b class="n">${fmt(s.despesas)}</b></span>
      <span>Livre <b class="n ${s.livre<0?'bad':'ok'}">${fmt(s.livre)}</b></span></div></div></div>`;
}
A.chartSel=d=>{chartSel=d.k;const x=$('ch-wrap')?.scrollLeft||0;render();if($('ch-wrap'))$('ch-wrap').scrollLeft=x;};
A.chartFilter=d=>{chartFilter=d.f;render();};
V.inicio=()=>{
  const t=totals(cur),m=data[cur],z=zoneOf(t.pct),over=t.livre<0;
  const nome=cur.split(' ')[0].toLowerCase();
  const [int,dec]=Math.abs(t.livre).toFixed(2).split('.');
  const av=avisos(t);
  const abertas=['d1','d2'].flatMap(c=>m[c].map((it,i)=>({c,i,it})).filter(x=>!x.it.paid)
    .sort((a,b)=>a.it.name.localeCompare(b.it.name,'pt')));
  const total=m.d1.length+m.d2.length;
  let h=monthBar();
  h+=`<section class="hero">
    <p class="hero-l">${over?`Está faltando em ${nome}`:`Livre em ${nome}`}</p>
    <p class="hero-v n ${over?'bad':''}"><small>${over?'−':''}R$</small><b>${(+int).toLocaleString('pt-BR')}</b><small>,${dec}</small></p>
    <p class="hero-s"><span class="chip ${z.k}">${z.t}</span>${t.pct===999?'Nenhuma receita lançada neste mês':t.receitaTotal?`${t.pct}% da renda comprometida`:'Lance a receita e as despesas na aba Mês'}</p>
  </section>`;
  h+=regua(m);
  if(av.length)h+=`<div class="sec"><div class="sec-h"><h2>Pede atenção</h2></div><div class="sf">${av.join('')}</div></div>`;
  h+=`<div class="sec"><div class="sec-h"><h2>A pagar ${abertas.length?`<span class="chip war n">${fmt(t.pendente)}</span>`:''}</h2>
      <button class="btn txt sm" data-a="go" data-t="mes">Ver o mês</button></div><div class="sf">`;
  if(!total)h+=`<div class="empty"><b>Nenhuma despesa em ${nome}</b>Adicione as contas do mês para acompanhar o que falta pagar.<br><button class="btn pri sm" data-a="go" data-t="mes" style="margin-top:12px">Lançar despesas</button></div>`;
  else if(!abertas.length)h+=`<div class="empty"><b>Tudo pago</b>As ${total} despesas de ${nome} estão quitadas.</div>`;
  else h+=abertas.slice(0,6).map(x=>expRow(x.c,x.i,x.it,CYCLES[x.c])).join('')
    +(abertas.length>6?`<button class="lnk" data-a="go" data-t="mes" style="padding:0 15px;color:var(--tx3);font-size:14px">Mais ${abertas.length-6} em aberto</button>`:'');
  h+=`</div></div>`;
  h+=chartHTML();
  return h;
};

/* ══ MÊS ══ */
const expRow=(c,i,it,tag)=>`<div class="row ${it.paid?'paid':''}">
  <button class="ck ${it.paid?'on':''}" data-a="paid" data-c="${c}" data-i="${i}" aria-label="${it.paid?'Marcar como não paga':'Marcar como paga'}: ${esc(it.name)}">${svg(IC.check,14)}</button>
  <button class="row-m" data-a="exp" data-c="${c}" data-i="${i}" aria-label="Editar ${esc(it.name)}">
    <span class="row-n">${esc(it.name)}${tag?`<small>${tag}</small>`:''}</span><span class="n row-v">${fmt(it.value)}</span></button></div>`;
function cycleHTML(c){
  const m=data[cur],items=m[c],rec=num(m[REC[c]]),g=sum(items),pg=sum(items.filter(i=>i.paid)),sobra=r2(rec-g);
  const ord=items.map((it,i)=>({it,i})).sort((a,b)=>(a.it.paid-b.it.paid)||a.it.name.localeCompare(b.it.name,'pt'));
  const note=m[c==='d1'?'note1':'note2'];
  return `<div class="sec"><div class="sec-h">
      <h2>${CYCLES[c]} ${rec>0||g>0?`<span class="chip ${sobra>=0?'ok':'bad'} n">${sobra>=0?'sobra':'falta'} ${fmt(Math.abs(sobra))}</span>`:''}</h2>
      <button class="ib" data-a="cycMenu" data-c="${c}" aria-label="Mais ações do ${CYCLES[c]}">${svg(IC.dots)}</button></div>
    <div class="sf">
      <div class="row flat"><button class="row-m" data-a="rec" data-c="${c}" style="padding-left:15px">
        <span class="row-n">Receita<small>entra no dia ${c==='d1'?'1':'15'}</small></span>
        <span class="n row-v ok">${rec?fmt(rec):'Informar'}</span>${svg(IC.right,15)}</button></div>
      ${items.length?ord.map(({it,i})=>expRow(c,i,it)).join('')
        :`<div class="empty">Nenhuma despesa neste ciclo. Digite a primeira aqui embaixo.</div>`}
      <div class="add" data-enter="addExp" data-c="${c}">
        <input class="in" id="nm-${c}" data-keep placeholder="Nova despesa" aria-label="Nome da despesa" autocomplete="off" enterkeyhint="next">
        <input class="in num money" id="vl-${c}" data-keep inputmode="decimal" placeholder="0,00" aria-label="Valor" autocomplete="off" enterkeyhint="done">
        <button class="btn pri" data-a="addExp" data-c="${c}">Adicionar</button>
      </div>
    </div>
    ${items.length?`<p class="hint" style="margin:8px 4px 0">${pl(items.length,'despesa','despesas')} somando <span class="n">${fmt(g)}</span>, das quais <span class="n">${fmt(pg)}</span> já pagas. Toque numa despesa para editar.</p>`:''}
    <details ${note?'open':''} style="margin-top:6px"><summary style="padding:8px 4px">Anotação do ciclo</summary>
      <textarea class="in" id="nt-${c}" data-i="note" data-c="${c}" rows="2" placeholder="Algo para lembrar neste ciclo" aria-label="Anotação do ${CYCLES[c]}">${esc(note)}</textarea></details>
  </div>`;
}
V.mes=()=>monthBar()+cycleHTML('d1')+cycleHTML('d2');
ON.note=(d,el)=>{ensure(cur)[d.c==='d1'?'note1':'note2']=el.value;save('data');};
A.paid=d=>{const it=data[cur]?.[d.c]?.[+d.i];if(!it)return;it.paid=!it.paid;save('data');render();};
A.addExp=d=>{

/* ══ CARTÕES ══ */
const avulsoName=c=>`${c} (avulso)`;
const pagas=p=>p.meses.filter(m=>(data[m]?.[p.ciclo]||[]).some(d=>same(d.name,p.cartao)&&d.paid)).length;
const normTxt=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const CARD_STOP=['cartao','card','credito','de','do','da','fatura'];
/* Um lançamento pertence ao cartão quando o nome dele contém o nome do cartão
   (sem acento, sem maiúscula, ignorando "cartão"/"fatura"). Ex.: "Fatura PicPay", "BTG". */
function cardMatch(itemName,card){
  const words=normTxt(itemName).split(/[^a-z0-9]+/).filter(Boolean);
  const toks=normTxt(card).split(/[^a-z0-9]+/).filter(t=>t&&!CARD_STOP.includes(t));
  if(!toks.length)return same(itemName,card);
  if(toks.every(t=>words.includes(t)))return true;
  const cc=toks.join('');
  return cc.length>=6&&words.join('').includes(cc);
}
/* Limite tomado: o que está lançado e não pago do mês atual em diante com o nome do cartão,
   mais as parcelas de compras que ainda não têm mês cadastrado. */
function cardUsageDetail(c){
  const now=nowKey(),meses=[];let total=0;
  keys().filter(k=>cmpKey(k,now)>=0).forEach(k=>{
    const v=sum([...data[k].d1,...data[k].d2].filter(d=>!d.paid&&cardMatch(d.name,c)));
    if(v>0){meses.push({k,v});total+=v;}
  });
  let semMes=0;
  cards.parceladas.filter(p=>same(p.cartao,c)&&pagas(p)<p.n).forEach(p=>{semMes+=Math.max(p.n-p.meses.length,0)*p.parcela;});
  return {total:r2(total+semMes),meses,semMes:r2(semMes)};
}
const cardUsage=c=>cardUsageDetail(c).total;
function mesesOf(p){const o=[];if(!validKey(p.ini))return o;for(let i=0;i<p.n;i++){const m=shift(p.ini,i);if(data[m])o.push(m);}return o;}
function desiredOf(p){const o={};mesesOf(p).forEach(m=>{o[pk(m,p.ciclo,p.cartao)]=p.parcela;});return o;}
/* Ajusta as faturas pela diferença entre o que já foi lançado (applied) e o desejado.
   Faturas já marcadas como pagas não são mexidas. */
function syncParcela(p,desired){
  const ap=p.applied||{},out={};
  new Set([...Object.keys(ap),...Object.keys(desired)]).forEach(key=>{
    let m,c,card;try{[m,c,card]=JSON.parse(key);}catch{return;}
    const want=r2(desired[key]||0),had=r2(ap[key]||0),delta=r2(want-had);
    if(!data[m])return;
    const l=ensureC(m,c);let it=l.find(d=>same(d.name,card));
    if(delta!==0){
      if(it&&it.paid){if(had)out[key]=had;return;}
      if(!it){if(delta<=0)return;it={name:card,value:0,paid:false};l.push(it);}
      it.value=Math.max(r2(it.value+delta),0);
      if(!it.value)l.splice(l.indexOf(it),1);
    }
    if(want)out[key]=want;
  });
  p.applied=out;
}
function parcPendentes(){
  let n=0;
  cards.parceladas.forEach(p=>{
    if(pagas(p)>=p.n)return;
    Object.keys(desiredOf(p)).forEach(key=>{
      if(key in (p.applied||{}))return;
      let m,c,card;try{[m,c,card]=JSON.parse(key);}catch{return;}
      const it=(data[m]?.[c]||[]).find(d=>same(d.name,card));
      if(!(it&&it.paid))n++;
    });
  });
  return n;
}
function renameCard(old,nv){
  cards.list=cards.list.map(c=>same(c,old)?nv:c);
  if(old!==nv&&old in cards.limits){cards.limits[nv]=cards.limits[old];delete cards.limits[old];}
  if(old!==nv&&cards.avulsos[old]){cards.avulsos[nv]=cards.avulsos[old];delete cards.avulsos[old];}
  cards.parceladas.forEach(p=>{
    if(same(p.cartao,old))p.cartao=nv;
    const ap={};Object.entries(p.applied||{}).forEach(([k,v])=>{try{const [m,c,card]=JSON.parse(k);ap[pk(m,c,same(card,old)?nv:card)]=v;}catch{}});
    p.applied=ap;
  });
  const oldAv=avulsoName(old),newAv=avulsoName(nv);
  keys().forEach(k=>['d1','d2'].forEach(c=>data[k][c].forEach(d=>{
    if(same(d.name,old))d.name=nv;else if(d.name===oldAv)d.name=newAv;})));
}
function simHTML(){
  const v=pm(val('sim-v'))||0,n=pint(val('sim-n'))||0,ini=val('sim-m');
  if(!v||!n||!ini)return '<p class="hint">Preencha valor e parcelas para ver como cada mês fica.</p>';
  const parcela=r2(v/n);
  const ms=keys().filter(k=>cmpKey(k,ini)>=0).slice(0,n);
  if(!ms.length)return '<p class="hint">Nenhum mês cadastrado a partir daí.</p>';
  let crit=0;
  const rows=ms.map(k=>{
    const t=totals(k),nova=r2(t.despesas+t.destinado+parcela);
    const p2=t.receitaTotal>0?Math.round(nova/t.receitaTotal*100):999;
    const z=zoneOf(p2);if(z.k==='bad')crit++;
    return `<div class="sim-r"><b style="min-width:52px">${short(k)}</b>
      <span style="flex:1" class="dim">${t.pct===999?'—':t.pct+'%'} passa para <b class="${z.k}">${p2===999?'—':p2+'%'}</b></span>
      <span style="text-align:right"><b class="${z.k}">${z.t}</b><br><span class="n dim">sobra ${fmt(r2(t.receitaTotal-nova))}</span></span></div>`;}).join('');
  const faltam=n-ms.length;
  return `<p class="hint" style="margin-bottom:10px"><b class="n">${fmt(parcela)}</b> por mês durante ${pl(n,'mês','meses')}.
    ${crit?`<span class="bad">${pl(crit,'mês estoura','meses estouram')}.</span>`:'Cabe em todos os meses.'}
    ${faltam>0?`<span class="war">${pl(faltam,'mês ainda não cadastrado','meses ainda não cadastrados')}.</span>`:''}</p>${rows}`;
}

  const card=ctx.card,mine=cards.parceladas.filter(p=>same(p.cartao,card));

function antHTML(d,n){
  const rest=Math.max(d.parcelas-d.pagas,0),r=num(d.taxa)/100;
  if(!rest)return '';
  if(r<=0)return '<p class="hint">Preencha a taxa de juros e salve para simular a antecipação.</p>';
  if(!n)return '';
  const saldo=saldoDevedor(d),nReal=Math.min(n,rest);
  const pago=r2(d.parcela*(1-Math.pow(1+r,-nReal))/r);
  if(n>=rest||pago>=saldo){
    const eco=Math.max(r2(d.parcela*rest-saldo),0);
    return `<div class="box"><div><span>Quita a dívida inteira por</span><b class="n">${fmt(saldo)}</b></div><div><span>Economia em juros</span><b class="n ok">${fmt(eco)}</b></div></div>`;
  }
  const novoSaldo=r2(saldo-pago);let novas=rest-n;
  const base=d.parcela-novoSaldo*r;
  if(base>0&&novoSaldo>0){const c=Math.ceil(Math.log(d.parcela/base)/Math.log(1+r));if(Number.isFinite(c)&&c>0)novas=c;}
  novas=Math.max(novas,0);
  const eco=Math.max(r2(d.parcela*rest-(pago+d.parcela*novas)),0);
  return `<div class="box"><div><span>Você paga agora</span><b class="n">${fmt(pago)}</b></div>
    <div><span>Parcelas restantes</span><b>de ${rest} para ${novas}</b></div>
    <div><span>Economia em juros</span><b class="n ok">${fmt(eco)}</b></div></div>`;
}

function normTime(s){
  const t=String(s).trim();if(!t)return '';
  const m=t.match(/^(\d{1,2})(?::?(\d{2}))?$/);if(!m)return null;
  const h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return null;
  return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
}

  if(!e.view){const b=sel?new Date(sel+'T12:00'):new Date();e.view=new Date(b.getFullYear(),b.getMonth(),1);}
  const y=e.view.getFullYear(),m=e.view.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  let cells=['D','S','T','Q','Q','S','S'].map(w=>`<span class="wd">${w}</span>`).join('')+'<span></span>'.repeat(first);
  for(let d=1;d<=dim;d++){
    const iso=isoOf(new Date(y,m,d));
    cells+=`<button type="button" class="cd ${iso===sel?'sel':''} ${iso===today?'today':''} ${iso<today?'past':''}" data-a="estPick" data-iso="${iso}" aria-label="${d} de ${MLONG[m]}">${d}</button>`;
  }
  $('est-cal').innerHTML=`<div class="cal-h"><button type="button" class="ib" data-a="estMove" data-n="-1" aria-label="Mês anterior">${svg(IC.left)}</button>
    <b>${MLONG[m][0].toUpperCase()+MLONG[m].slice(1)} de ${y}</b>
    <button type="button" class="ib" data-a="estMove" data-n="1" aria-label="Próximo mês">${svg(IC.right)}</button></div><div class="cal-g">${cells}</div>`;
  const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));
  const sab=[];for(let i=0;i<4;i++){sab.push(isoOf(d));d.setDate(d.getDate()+7);}
  $('est-quick').innerHTML=sab.map(iso=>`<button type="button" class="btn sm ${iso===sel?'pri':''}" data-a="estPick" data-iso="${iso}">sáb ${iso.slice(8)}/${iso.slice(5,7)}</button>`).join('');
  const hh=tm.slice(0,2),mm=tm.slice(3);
  const hs=Array.from({length:15},(_,i)=>String(i+7).padStart(2,'0'));if(hh&&!hs.includes(hh)){hs.push(hh);hs.sort();}
  $('est-hrs').innerHTML=hs.map(h=>`<button type="button" class="${h===hh?'on':''}" data-a="estHour" data-h="${h}">${h}h</button>`).join('');
  const ms=['00','15','30','45'];if(mm&&!ms.includes(mm)){ms.push(mm);ms.sort();}
  $('est-mins').innerHTML=ms.map(x=>`<button type="button" class="${x===mm?'on':''}" data-a="estMin" data-m="${x}">:${x}</button>`).join('');
  if(sel){const dt=new Date(sel+'T12:00');
    $('est-sum').innerHTML=`<span>${WDLONG[dt.getDay()]}</span><b>${dt.getDate()} de ${MLONG[dt.getMonth()]}${dt.getFullYear()!==new Date().getFullYear()?' de '+dt.getFullYear():''}</b>${tm?`<em>${hLabel(tm)}</em>`:''}`;}
  else $('est-sum').innerHTML='<span>Data</span><b class="dim">Toque num dia do calendário</b>';
}
A.estOpen=d=>{
  const e=d.id?(sessions.estetica||[]).find(x=>x.id===d.id):null;
  const p=d.pend?(sessions.esteticaPend||[]).find(x=>x.id===d.pend):null;
  ctx.est={id:e?.id||null,pendId:p?.id||null,date:e?.date||'',time:normTime(e?.time||'')||'09:00',view:null};
  sheet(head(e?'Editar procedimento':'Agendar procedimento','Data, horário e as áreas da sessão.')+`<div class="sh-b">
    ${F('Procedimento ou áreas','est-desc',e?.desc||p?.area||'','placeholder="Barba, axilas…"')}
    <div class="pick" id="est-sum"></div><div class="cal" id="est-cal"></div><div class="quick" id="est-quick"></div>
    <div class="fd" style="margin-top:14px"><span>Horário</span><div class="hrs" id="est-hrs"></div><div class="mins" id="est-mins"></div></div></div>`
    +acts('estOk',e?'Salvar':'Agendar')+(e?`<div class="sh-more">${lnk('estDel',IC.trash,'Excluir agendamento','','dng')}</div>`:''));
  renderPicker();
};
A.estPick=d=>{const e=ctx.est;e.date=d.iso;const x=new Date(d.iso+'T12:00');e.view=new Date(x.getFullYear(),x.getMonth(),1);renderPicker();};
A.estHour=d=>{ctx.est.time=d.h+':'+(ctx.est.time||'09:00').slice(3);renderPicker();};
A.estMin=d=>{ctx.est.time=(ctx.est.time||'09:00').slice(0,2)+':'+d.m;renderPicker();};
A.estMove=d=>{const v=ctx.est.view;ctx.est.view=new Date(v.getFullYear(),v.getMonth()+(+d.n),1);renderPicker();};
A.estOk=()=>{
  const {id,pendId,date,time}=ctx.est,desc=val('est-desc');
  if(!desc){toast('Descreva o procedimento.','err');$('est-desc').focus();return;}
  if(!date){toast('Escolha a data no calendário.','err');return;}
  const l=sessions.estetica=sessions.estetica||[];
  if(id){const e=l.find(x=>x.id===id);if(e)Object.assign(e,{date,time,desc});}
  else{
    l.push({id:uid('e'),date,time,desc,done:false});
    const p=pendId&&(sessions.esteticaPend||[]).find(x=>x.id===pendId);
    if(p&&p.qtd>0)p.qtd--;
  }
  save('sessions');closeSheet();render();toast(id?'Agendamento salvo.':'Procedimento agendado.');
};
A.estToggle=d=>{const e=(sessions.estetica||[]).find(x=>x.id===d.id);if(!e)return;e.done=!e.done;save('sessions');render();};
A.estDel=()=>{
  const l=sessions.estetica||[],i=l.findIndex(x=>x.id===ctx.est?.id);if(i<0)return;
  const e=l[i];l.splice(i,1);save('sessions');closeSheet();render();
  toast('Agendamento excluído.',{undo:()=>{(sessions.estetica=sessions.estetica||[]).push(e);save('sessions');render();}});
};
A.pendAdd=()=>{
  const a=val('pend-area'),q=val('pend-qtd')===''?1:pint(val('pend-qtd'));
  if(!a){toast('Informe a área.','err');$('pend-area').focus();return;}
  if(!Number.isFinite(q)||q<1){toast('Quantidade inválida.','err');return;}
  (sessions.esteticaPend=sessions.esteticaPend||[]).push({id:uid('p'),area:a,qtd:q});
  $('pend-area').value='';$('pend-qtd').value='';save('sessions');render();
};
A.pendInc=d=>{const p=(sessions.esteticaPend||[]).find(x=>x.id===d.id);if(!p)return;p.qtd=Math.max(p.qtd+(+d.n),0);save('sessions');render();};
A.pendOpen=d=>{
  const p=(sessions.esteticaPend||[]).find(x=>x.id===d.id);if(!p)return;ctx.pend=p.id;
  sheet(head('Editar área')+`<div class="sh-b" data-enter="pendOk">${F('Nome da área','pd-nome',p.area,'data-focus')}</div>`+acts('pendOk','Salvar')
    +`<div class="sh-more">${lnk('pendDel',IC.trash,'Excluir área','','dng')}</div>`,{select:true});
};
A.pendOk=()=>{const p=(sessions.esteticaPend||[]).find(x=>x.id===ctx.pend),v=val('pd-nome');if(!p)return;
  if(!v){toast('Dê um nome à área.','err');return;}p.area=v;save('sessions');closeSheet();render();};
A.pendDel=()=>{
  const l=sessions.esteticaPend||[],i=l.findIndex(x=>x.id===ctx.pend);if(i<0)return;
  const p=l[i];l.splice(i,1);save('sessions');closeSheet();render();
  toast(`"${p.area}" excluída.`,{undo:()=>{(sessions.esteticaPend=sessions.esteticaPend||[]).splice(i,0,p);save('sessions');render();}});
};

/* ══ AJUSTES ══ */
V.ajustes=()=>{
  const hidePref=lsGet(K.hide,true)!==false;
  return `<h1>Ajustes</h1><p class="lead">Aparência, privacidade e seus dados</p>
  <div class="sec"><div class="sf">
    <div class="opt"><div><b>Tema</b><small>Fica salvo neste aparelho.</small></div>
      <div class="seg"><button class="${tema==='claro'?'on':''}" data-a="tema" data-v="claro">Claro</button><button class="${tema==='escuro'?'on':''}" data-a="tema" data-v="escuro">Escuro</button></div></div>
    <div class="opt"><div><b>Ao abrir o app</b><small>Com os valores ocultos, toque no olho do topo para mostrar.</small></div>
      <div class="seg"><button class="${hidePref?'on':''}" data-a="hidePref" data-v="1">Ocultar valores</button><button class="${hidePref?'':'on'}" data-a="hidePref" data-v="0">Mostrar</button></div></div>
  </div></div>
  <div class="sec"><div class="sec-h"><h2>Sincronização</h2></div><div class="sf">
    <div class="opt"><div><b id="sync-m">${syncText()}</b><small>Os dados ficam guardados neste aparelho e vão para a nuvem para aparecer nos outros. Sem internet, o app continua funcionando e envia tudo quando a conexão voltar.</small></div>
      <button class="btn sm" data-a="syncNow">Sincronizar agora</button></div>
    ${noCloud.cards?`<div class="opt"><div><small class="war">Cartões e compras parceladas estão só neste aparelho: a regra do Firestore não liberou o documento "cartoes".</small></div></div>`:''}
  </div></div>
  <div class="sec"><div class="sec-h"><h2>Backup</h2></div><div class="sf sf-p">
    <p class="hint" style="margin-bottom:12px">O arquivo leva tudo: meses, cartões, compras parceladas, planos, sessões e reservas. Restaurar substitui os dados atuais.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" style="flex:1" data-a="export">Baixar backup</button><button class="btn" style="flex:1" data-a="import">Restaurar backup</button></div>
  </div></div>
  <p class="hint" style="text-align:center;margin-top:24px">Finanças, versão ${VERSION}</p>`;
};
A.tema=d=>{tema=d.v==='claro'?'claro':'escuro';try{localStorage.setItem(K.tema,tema);}catch{}applyTema();render();};
A.hidePref=d=>{lsSet(K.hide,d.v==='1');blurred=d.v==='1';render();};
A.syncNow=()=>{
  if(navigator.onLine===false){toast('Sem internet agora. Os dados seguem salvos no aparelho.','err');return;}
  if(!FS){connect().then(()=>toast(FS?'Conectado à nuvem.':'Não deu para conectar agora.',FS?undefined:'err'));return;}
  const ks=Object.keys(dirty);ks.forEach(k=>push(k));
  toast(ks.length?'Enviando as alterações…':'Já está tudo sincronizado.');
};
A.export=()=>{
  try{
    const payload={version:VERSION,exportedAt:new Date().toISOString(),finances:data,sessions,sessionItems,planning,reservas,
      inter:lsGet(K.inter,[]),parceladas:cards.parceladas,cardLimits:cards.limits,cardAvulsos:cards.avulsos,cardList:cards.list};
    const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=`financas_${todayISO()}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('Backup baixado.');
  }catch(e){console.error(e);toast('Não deu para gerar o backup.','err');}
};
A.import=()=>$('file-in').click();
$('file-in').addEventListener('change',e=>{
  const file=e.target.files?.[0];e.target.value='';if(!file)return;
  const rd=new FileReader();
  rd.onerror=()=>toast('Não deu para ler o arquivo.','err');
  rd.onload=async ev=>{
    let imp;
    try{imp=JSON.parse(ev.target.result);}catch{toast('Esse arquivo não é um backup válido.','err');return;}
    if(!imp||typeof imp!=='object'||Array.isArray(imp)){toast('Esse arquivo não é um backup válido.','err');return;}
    const novo=nData(imp.finances||imp);
    if(!Object.keys(novo).length){toast('O backup não tem nenhum mês.','err');return;}
    if(!await ask({title:'Restaurar este backup?',text:`Ele tem ${pl(Object.keys(novo).length,'mês','meses')}${imp.exportedAt?`, salvo em ${new Date(imp.exportedAt).toLocaleDateString('pt-BR')}`:''}. Os dados atuais deste aparelho e da nuvem são substituídos.`,ok:'Restaurar backup',danger:true}))return;
    data=novo;invalidate();
    if(imp.sessions)sessions=nSessions(imp.sessions);
    if(imp.planning)planning=nPlanning(imp.planning);
    if(Array.isArray(imp.sessionItems))sessionItems=nSessionItems(imp.sessionItems);
    if(Array.isArray(imp.reservas))reservas=nReservas(imp.reservas);
    cards=nCards({list:Array.isArray(imp.cardList)?imp.cardList:cards.list,limits:imp.cardLimits||cards.limits,
      avulsos:imp.cardAvulsos||cards.avulsos,parceladas:Array.isArray(imp.parceladas)?imp.parceladas:cards.parceladas});
    if(Array.isArray(imp.inter))lsSet(K.inter,imp.inter);
    lsSet(K.cardsMig,true);ssSet(HIST,[]);
    Object.keys(ST).forEach(save);
    cur=pickCur();tab='inicio';render(true);
    toast('Backup restaurado.');
  };
  rd.readAsText(file);
});

/* ══ INÍCIO DO APP ══ */
/* Dados iniciais: só entram num aparelho que ainda não tem nada salvo. Não são marcados como
   pendentes, então o que estiver na nuvem continua valendo quando o app conectar. */
function seedIfEmpty(){
  try{
    if(localStorage.getItem(K.data)!=null)return;
    const s=JSON.parse($('seed')?.textContent||'null');if(!s||!s.finances)return;
    lsSet(K.data,nData(s.finances));lsSet(K.sessions,nSessions(s.sessions));lsSet(K.sessionItems,nSessionItems(s.sessionItems));
    lsSet(K.planning,nPlanning(s.planning));lsSet(K.reservas,nReservas(s.reservas));
    const c=nCards({list:s.cardList,limits:s.cardLimits,avulsos:s.cardAvulsos,parceladas:s.parceladas});
    lsSet(K.cards,c.list);lsSet(K.limits,c.limits);lsSet(K.avulsos,c.avulsos);lsSet(K.parceladas,c.parceladas);
  }catch(e){console.warn(e);}
}
function init(){
  seedIfEmpty();
  const d=lsGet(K.dirty,{});dirty=d&&typeof d==='object'&&!Array.isArray(d)?d:{};
  data=nData(lsGet(K.data,{}));
  sessions=nSessions(lsGet(K.sessions,{}));
  sessionItems=nSessionItems(lsGet(K.sessionItems,DEFAULT_SESSION_ITEMS));
  planning=nPlanning(lsGet(K.planning,{}));
  reservas=nReservas(lsGet(K.reservas,[]));
  cards=nCards({list:lsGet(K.cards,[]),limits:lsGet(K.limits,{}),avulsos:lsGet(K.avulsos,{}),parceladas:lsGet(K.parceladas,[])});
  blurred=lsGet(K.hide,true)!==false;
  invalidate();
  if(!keys().length)ensure(nowKey());
  cur=pickCur();
  applyTema();render(true);
  setSync(navigator.onLine===false?'offline':'saving');
  if(navigator.onLine!==false){const el=$('sync');el.className='sync';el.innerHTML='<i></i>Conectando…';}
  connect();
}
init();
</script>
